<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/style.css">
    <title>FAÇA LOGIN</title>
</head>
<body> 
    <div class="login">
        <!-- O formulário intercepta o 'Enter' e o clique do botão automaticamente -->
        <form id="loginForm" onsubmit="validarLogin(event)">
            <label for="emailInput">LOGIN</label>
            <input type="email" id="emailInput" value="admin@nathalia.com" placeholder="Usuário" required>
            
            <br><br>
            
            <label for="senhaInput">SENHA</label>
            <input type="password" id="senhaInput" value="12345678" maxlength="8" required placeholder="********">
            
            <br><br>
            
            <button type="submit" class="entrar">Entrar</button>
        </form>
    </div>

    <script>
        const SENHA_CORRETA = "12345678";
        const LOGIN_CORRETO = "admin@nathalia.com";

        function validarLogin(event) {
            // Evita que a página recarregue ao enviar o formulário
            event.preventDefault();

            const loginDigitado = document.getElementById("emailInput").value.trim();
            const senhaDigitada = document.getElementById("senhaInput").value;

            if (loginDigitado === LOGIN_CORRETO && senhaDigitada === SENHA_CORRETA) {
                // Descobre a pasta atual dinamicamente sem quebrar no GitHub Pages ou Local
                const pathAtual = window.location.pathname;
                const pastaBase = pathAtual.substring(0, pathAtual.lastIndexOf('/'));
                
                // Redireciona com base na localização atual
                window.location.assign(pastaBase + "/html/dashboard.html");
            } else {
                alert("E-mail ou senha incorretos! Tente novamente.");
            }
        }
    </script>

    <div class="text1">
        <p>Feito por Nathália Renata Garcia Oliveira<br>
        Contato: nathalia.renata.oli@gmail.com</p>
    </div>
</body>
</html>
