<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/style.css">
    <title>FAÇA LOGIN</title>
</head>
<body> 
    <div class="login">
        <label for="emailInput">LOGIN</label>
        <input type="email" id="emailInput" value="admin@nathalia.com" placeholder="Usuário" onkeyup="verificarTeclas(event)">
        
        <br><br>
        
        <label for="senhaInput">SENHA</label>
        <input type="password" id="senhaInput" value="12345678" maxlength="8" required placeholder="********" onkeyup="verificarTeclas(event)">
        
        <br><br>
        
        <input class="entrar" type="button" value="Entrar" onclick="entra()">
    </div>

    <script>
        // Definir a senha e login padrão do sistema
        const SENHA_CORRETA = "12345678";
        const LOGIN_CORRETO = "admin@nathalia.com";

        function entra() {
            const loginDigitado = document.getElementById("emailInput").value.trim();
            const senhaDigitada = document.getElementById("senhaInput").value;

            if (loginDigitado === LOGIN_CORRETO && senhaDigitada === SENHA_CORRETA) {
                // Redireciona para o Dashboard
                window.location.href = "e-commerce-sales/dashboard.html";
            } else {
                alert("E-mail ou senha incorretos! Tente novamente.");
            }
        }

        // Permite entrar ao pressionar a tecla 'Enter' em qualquer um dos campos
        function verificarTeclas(event) {
            if (event.key === "Enter") {
                entra();
            }
        }    
    </script>

    <div class="text1">
        <p>Feito por Nathália Renata Garcia Oliveira<br>
        Contato: nathalia.renata.oli@gmail.com</p>
    </div>
</body>
</html>
