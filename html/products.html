<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="user-profile">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <h3>Usuário</h3>
                    <p>Empresa</p>
                    <p class="role">Cargo</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="../html/dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                    <li><a href="../html/sales.html"><i class="fa-solid fa-chart-line"></i> Vendas</a></li>
                    <li><a href="../html/clients.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
                    <li><a href="../html/products.html"><i class="fa-solid fa-box-open"></i> Produtos</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer"><i class="fa-solid fa-bars"></i></div>
        </aside>

        <main class="main-content">
            
            <header class="main-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar produtos por nome, SKU, pedidos, clientes, ...">
                </div>
                
                <div class="dropdown-io">
                    <button class="btn-io">
                        <i class="fa-solid fa-circle-down"></i> Exportar e Importar
                    </button>
                    <div class="dropdown-content">
                        <div class="dropdown-section">
                            <span class="section-title">Exportar atual</span>
                            <a href="#" onclick="exportarProdutosPDF()"><i class="fa-regular fa-file-pdf"></i> PDF</a>
                            <a href="#" onclick="exportarProdutosCSV()"><i class="fa-solid fa-file-csv"></i> CSV</a>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-section">
                            <span class="section-title">Importar novos dados</span>
                            <label class="import-label">
                                <input type="file" id="produtosCsvInput" accept=".csv" onchange="importarProdutosCSV(event)" style="display:none;">
                                <span><i class="fa-solid fa-file-csv"></i> Selecionar arquivo CSV</span>
                            </label>
                        </div>
                    </div>
                </div>

                <button class="btn-add-order">
                    <i class="fa-solid fa-plus"></i> Adicionar Produtos
                </button>
            </header>

            <section class="products-section">
                <h1 class="page-title">Produtos</h1>

                <div class="clients-search-container">
                    <div class="sub-search-bar full-width-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Buscar nome, e-mail ou cpf">
                    </div>
                </div>

                <div class="table-container" id="printable-products-table">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th id="total-count-header"> Produtos</th>
                                <th>Categoria</th>
                                <th>Valor</th>
                                <th style="text-align: right; padding-right: 20px;"></th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                <tr>
                    <td>
                        <div class="product-cell">
                            <!-- O clique no LABEL aciona o INPUT sem necessidade de código JS no clique -->
                            <label class="product-image" title="Clique para alterar a imagem">
                                <i class="fa-regular fa-image"></i>
                                <input type="file" accept="image/*" onchange="trocarImagem(event)">
                            </label>
                            <div class="product-meta">
                                <span class="product-name">Colar Coração</span>
                                <span class="product-qty">8 unidades</span>
                                
                            </div>
                        </div>
                    </td>
                    <td>Colar</td>
                    <td>R$ 30,00</td>
                </tr>
                <tr>
                    <td>
                        <div class="product-cell">
                            <label class="product-image" title="Clique para alterar a imagem">
                                <i class="fa-regular fa-image"></i>
                                <input type="file" accept="image/*" onchange="trocarImagem(event)">
                            </label>
                            <div class="product-meta">
                                <span class="product-name">Pulseira Girassol Cravejado</span>
                                <span class="product-qty"> 12unidades</span>
                                
                            </div>
                        </div>
                    </td>
                    <td>Pulseira</td>
                    <td>R$ 120,00</td>
                </tr>
            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
